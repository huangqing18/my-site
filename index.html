<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羽绒服服装管理系统</title>
    <!-- 优先加载官方SDK -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://static.bmob.com/sdk/js/bmob-3.9.4.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", sans-serif; }
        body { background: linear-gradient(135deg, #f0f7ff 0%, #d9e6f8 100%); min-height: 100vh; padding: 20px; }
        .login-container { display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 40px); }
        .login-card { background: #fff; width: 100%; max-width: 460px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,51,102,0.1); padding: 45px 40px; border-top: 5px solid #3a7bd5; }
        .login-title { text-align: center; font-size: 26px; font-weight: 600; color: #224466; margin-bottom: 12px; }
        .login-subtitle { text-align: center; color: #6688aa; margin-bottom: 35px; font-size: 14px; }
        .tab-group { display: flex; border-bottom: 1px solid #e6eff8; margin-bottom: 25px; }
        .tab-item { flex: 1; text-align: center; padding: 12px 0; cursor: pointer; color: #7799bb; font-weight: 500; border-bottom: 3px solid transparent; transition: all 0.3s; }
        .tab-item.active { color: #3a7bd5; border-color: #3a7bd5; }
        .form-group { margin-bottom: 22px; }
        .form-group label { display: block; margin-bottom: 8px; color: #334455; font-size: 14px; font-weight: 500; }
        .form-control { width: 100%; height: 46px; border: 1px solid #d6e4f3; border-radius: 10px; padding: 0 15px; font-size: 15px; color: #224466; }
        .form-control:focus { outline: none; border-color: #3a7bd5; }
        .remember-row { display: flex; align-items: center; margin-bottom: 25px; font-size: 14px; color: #557799; }
        .remember-row input { margin-right: 8px; width: 16px; height: 16px; }
        .btn-login { width: 100%; height: 48px; background: linear-gradient(90deg, #3a7bd5, #4a90e2); color: #fff; border: none; border-radius: 12px; font-size: 16px; cursor: pointer; }
        .main-container { max-width: 1200px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 30px; }
        .user-bar { display: flex; justify-content: space-between; align-items: center; background: #f5f9ff; padding: 14px 20px; border-radius: 12px; margin-bottom: 25px; color: #224466; }
        .page-title { font-size: 24px; color: #224466; margin-bottom: 20px; padding-left: 12px; border-left: 4px solid #3a7bd5; }
        .toolbar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
        .btn { padding: 10px 18px; border-radius: 10px; font-size: 14px; border: none; cursor: pointer; }
        .btn-primary { background: #3a7bd5; color: #fff; }
        .btn-success { background: #2ecc71; color: #fff; }
        .btn-default { background: #94a7c6; color: #fff; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .search-input { flex: 1; min-width: 280px; height: 42px; border: 1px solid #d6e4f3; border-radius: 10px; padding: 0 15px; }
        .table-wrapper { border-radius: 12px; overflow: hidden; border: 1px solid #e6eff8; }
        table { width: 100%; border-collapse: collapse; background: #fff; }
        thead th { background: linear-gradient(90deg, #3a7bd5, #4a90e2); color: #fff; padding: 16px 12px; text-align: center; }
        tbody td { padding: 14px 12px; text-align: center; color: #334455; border-bottom: 1px solid #f0f7ff; }
        .tag { padding: 4px 10px; border-radius: 12px; font-size: 12px; color: #fff; }
        .tag-success { background-color: #2ecc71; }
        .tag-danger { background-color: #e74c3c; }
        .tag-blue { background-color: #3a7bd5; }
        .opt-btn { padding: 4px 10px; border-radius: 6px; font-size: 13px; cursor: pointer; margin: 0 3px; }
        .edit-btn { background: #e6f0ff; color: #3a7bd5; }
        .del-btn { background: #ffebee5; color: #e74c3c; }
        .order-no { color: #3a7bd5; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); justify-content: center; align-items: center; z-index: 9999; }
        .modal-content { background: #fff; width: 90%; max-width: 650px; border-radius: 16px; padding: 35px; max-height: 90vh; overflow-y: auto; }
        .modal-title { font-size: 20px; color: #224466; margin-bottom: 25px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
<div class="login-container" id="loginWrap">
    <div class="login-card">
        <div class="login-title">羽绒服服装管理系统</div>
        <div class="login-subtitle">专业、高效、便捷的订单与员工管理</div>
        <div class="tab-group">
            <div class="tab-item active" onclick="switchTab(0)">员工 / 管理员</div>
            <div class="tab-item" onclick="switchTab(1)">客户查询订单</div>
        </div>
        <div id="staffLogin">
            <div class="form-group">
                <label>账号</label>
                <input type="text" class="form-control" id="loginAccount" placeholder="请输入账号">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" class="form-control" id="loginPwd" placeholder="请输入密码">
            </div>
            <div class="remember-row">
                <input type="checkbox" id="rememberPwd">
                <label for="rememberPwd">记住账号密码</label>
            </div>
            <button class="btn-login" onclick="staffLogin()">立即登录</button>
        </div>
        <div id="customerLogin" class="hidden">
            <div class="form-group">
                <label>下单手机号</label>
                <input type="text" class="form-control" id="custPhone" placeholder="请输入手机号">
            </div>
            <button class="btn-login" onclick="customerLogin()">查询订单</button>
        </div>
    </div>
</div>

<div id="mainWrap" class="main-container hidden">
    <div class="user-bar">
        <div>当前身份：<span id="userRole"></span>｜账号：<span id="userName"></span></div>
        <div>
            <button class="btn btn-default" onclick="logout()">退出登录</button>
            <button id="userManageBtn" class="btn btn-success hidden" onclick="openUserManage()">人员管理</button>
        </div>
    </div>
    <div id="orderPage">
        <div class="page-title">订单管理</div>
        <div class="toolbar">
            <button id="addOrderBtn" class="btn btn-primary hidden">新增订单</button>
            <button id="exportBtn" class="btn btn-success hidden" onclick="exportExcel()">导出Excel</button>
            <input type="text" class="search-input" id="searchInput" placeholder="搜索：姓名 / 电话 / 订单编号 / 货号" oninput="renderTable()">
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>订单编号</th>
                        <th>充绒状态</th>
                        <th>机工</th>
                        <th>客户姓名</th>
                        <th>联系电话</th>
                        <th>是否到货</th>
                        <th>是否完工</th>
                        <th>订单日期</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="orderTable"><tr><td colspan="9">加载中...</td></tr></tbody>
            </table>
        </div>
    </div>
    <div id="userManagePage" class="hidden">
        <div class="page-title">人员账号管理</div>
        <div class="toolbar">
            <button class="btn btn-default" onclick="backToOrder()">返回订单</button>
            <button class="btn btn-primary" onclick="openUserEditModal()">新增员工</button>
            <input type="text" class="search-input" id="userSearch" placeholder="搜索账号" oninput="renderUserTable()">
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>员工账号</th>
                        <th>岗位角色</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="userTable"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal" id="editModal">
    <div class="modal-content">
        <div class="modal-title" id="editModalTitle">编辑订单</div>
        <div class="form-group"><label>充绒状态</label><select class="form-control" id="chongrong"><option value="未充绒">未充绒</option><option value="已充绒">已充绒</option></select></div>
        <div class="form-group"><label>机工</label><select class="form-control" id="jigongSelect"></select></div>
        <div class="form-group"><label>是否完工</label><select class="form-control" id="shifou1"><option value="否">否</option><option value="是">是</option></select></div>
        <div class="form-group"><label>客户姓名</label><input class="form-control" type="text" id="xingming"></div>
        <div class="form-group"><label>联系电话</label><input class="form-control" type="text" id="dianhua"></div>
        <div class="form-group"><label>厂家</label><input class="form-control" type="text" id="changjia"></div>
        <div class="form-group"><label>货号</label><input class="form-control" type="text" id="huohao"></div>
        <div class="form-group"><label>颜色</label><input class="form-control" type="text" id="yanse"></div>
        <div class="form-group"><label>尺码</label><input class="form-control" type="text" id="daxiao"></div>
        <div class="form-group"><label>单价</label><input class="form-control" type="number" id="jiage"></div>
        <div class="form-group"><label>押金</label><input class="form-control" type="number" id="yajin"></div>
        <div class="form-group"><label>是否到货</label><select class="form-control" id="shifou2"><option value="否">否</option><option value="是">是</option></select></div>
        <div class="form-group"><label>订单日期</label><input class="form-control" type="date" id="riqi"></div>
        <div class="form-group"><label>备注</label><input class="form-control" type="text" id="beizhu"></div>
        <div class="form-group"><label>签收</label><select class="form-control" id="qianshou"><option value="否">否</option><option value="是">是</option></select></div>
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:25px;">
            <button class="btn btn-default" onclick="closeEditModal()">取消</button>
            <button class="btn btn-primary" onclick="saveOrder()">保存</button>
        </div>
    </div>
</div>

<div class="modal" id="userEditModal">
    <div class="modal-content">
        <div class="modal-title" id="userEditTitle">新增员工</div>
        <div class="form-group"><label>账号</label><input class="form-control" type="text" id="editAccount"></div>
        <div class="form-group"><label>密码</label><input class="form-control" type="text" id="editPwd"></div>
        <div class="form-group"><label>岗位</label><select class="form-control" id="editRole"><option value="chong">充绒工</option><option value="jigong">机工</option></select></div>
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:25px;">
            <button class="btn btn-default" onclick="closeUserEditModal()">取消</button>
            <button class="btn btn-primary" onclick="saveUser()">保存</button>
        </div>
    </div>
</div>

<div class="modal" id="detailModal">
    <div class="modal-content">
        <div class="modal-title">订单详情</div>
        <div id="detailBox"></div>
        <div style="display:flex;justify-content:flex-end;margin-top:25px;">
            <button class="btn btn-default" onclick="closeDetailModal()">关闭</button>
        </div>
    </div>
</div>

<script>
let staffUsers = [];
let orders = [];
let currentUser = null;
let editId = null;
let editUserId = null;
const START_ORDER_NO = 80230001;

// ========= 请替换成你自己的 Bmob 密钥 =========
const APP_ID = "01650c56bc7714f7195d578d829bb531";
const REST_KEY = "4e12c9fb173ebe3ae62b70522e478c65";
// ============================================

const TABLE_USER = "StaffUser";
const TABLE_ORDER = "OrderData";

function initApp(){
    if(typeof Bmob === "undefined"){
        setTimeout(initApp, 300);
        return;
    }
    Bmob.initialize(APP_ID, REST_KEY);
    Bmob.config({ useSecurity: false });
    loadAllData();
}

async function loadAllData() {
    try {
        const userQuery = Bmob.Query(TABLE_USER);
        staffUsers = await userQuery.find();
        const orderQuery = Bmob.Query(TABLE_ORDER);
        orderQuery.order("createdAt");
        orders = await orderQuery.find();
        renderTable();
    } catch (e) {
        alert('加载失败：' + e.message);
    }
}

function switchTab(i) {
    document.querySelectorAll('.tab-item').forEach((t,k) => t.className = k===i ? 'tab-item active' : 'tab-item');
    document.getElementById('staffLogin').classList.toggle('hidden', i!==0);
    document.getElementById('customerLogin').classList.toggle('hidden', i!==1);
}

async function staffLogin() {
    let a = document.getElementById('loginAccount').value.trim();
    let p = document.getElementById('loginPwd').value.trim();
    let rem = document.getElementById('rememberPwd').checked;
    let user = staffUsers.find(u => u.account === a && u.pwd === p);
    if (!user) return alert('账号或密码错误');
    if(rem) localStorage.setItem('rememberLogin', JSON.stringify({account:a,pwd:p}));
    else localStorage.removeItem('rememberLogin');
    currentUser = user;
    loginOk();
}

function customerLogin() {
    let p = document.getElementById('custPhone').value.trim();
    if (!p) return alert('请输入手机号');
    currentUser = { role:'customer', roleName:'客户', phone:p, isCustomer: true };
    loginOk();
}

function loginOk() {
    document.getElementById('loginWrap').classList.add('hidden');
    document.getElementById('mainWrap').classList.remove('hidden');
    document.getElementById('userRole').innerText = currentUser.isCustomer ? '客户' : currentUser.roleName;
    document.getElementById('userName').innerText = currentUser.isCustomer ? '客户' : currentUser.account;
    let isAdmin = !currentUser.isCustomer && currentUser.role === 'admin';
    let isCust = currentUser.isCustomer;
    document.getElementById('userManageBtn').classList.toggle('hidden', !isAdmin);
    document.getElementById('addOrderBtn').classList.toggle('hidden', isCust);
    document.getElementById('exportBtn').classList.toggle('hidden', isCust);
    renderTable();
}

function logout() {
    currentUser = null;
    document.getElementById('mainWrap').classList.add('hidden');
    document.getElementById('loginWrap').classList.remove('hidden');
    document.getElementById('orderPage').classList.remove('hidden');
    document.getElementById('userManagePage').classList.add('hidden');
}

function openUserManage() {
    document.getElementById('orderPage').classList.add('hidden');
    document.getElementById('userManagePage').classList.remove('hidden');
    renderUserTable();
}

function backToOrder() {
    document.getElementById('userManagePage').classList.add('hidden');
    document.getElementById('orderPage').classList.remove('hidden');
}

function renderUserTable() {
    let t = document.getElementById('userTable');
    let kw = document.getElementById('userSearch').value.toLowerCase();
    let list = staffUsers.filter(u => {
        if (u.role === 'admin') return false;
        let a = (u.account || '').toLowerCase();
        let r = (u.roleName || '').toLowerCase();
        return a.includes(kw) || r.includes(kw);
    });
    t.innerHTML = '';
    list.forEach(u => {
        let tr = document.createElement('tr');
        tr.innerHTML = `
        <td>${u.account}</td>
        <td><span class="tag ${u.role==='jigong'?'tag-blue':'tag-success'}">${u.roleName}</span></td>
        <td>
            <span class="opt-btn edit-btn" onclick="editUser('${u.account}')">编辑</span>
            <span class="opt-btn del-btn" onclick="delUser('${u.account}')">删除</span>
        </td>`;
        t.appendChild(tr);
    });
}

function openUserEditModal() {
    editUserId = null;
    document.getElementById('userEditTitle').innerText = '新增员工';
    document.getElementById('editAccount').value = '';
    document.getElementById('editPwd').value = '';
    document.getElementById('editRole').value = 'chong';
    document.getElementById('editAccount').disabled = false;
    document.getElementById('userEditModal').style.display = 'flex';
}

function editUser(account) {
    let u = staffUsers.find(x => x.account === account);
    if (!u) return;
    editUserId = account;
    document.getElementById('userEditTitle').innerText = '编辑员工';
    document.getElementById('editAccount').value = u.account;
    document.getElementById('editPwd').value = u.pwd;
    document.getElementById('editRole').value = u.role;
    document.getElementById('editAccount').disabled = true;
    document.getElementById('userEditModal').style.display = 'flex';
}

async function saveUser() {
    let a = document.getElementById('editAccount').value.trim();
    let p = document.getElementById('editPwd').value.trim();
    let r = document.getElementById('editRole').value;
    let rn = r === 'jigong' ? '机工' : '充绒工';
    if (!a || !p) return alert('账号密码不能为空');
    try {
        if (editUserId) {
            let userItem = staffUsers.find(x => x.account === editUserId);
            const user = Bmob.Object(TABLE_USER);
            user.id = userItem.objectId;
            user.set("pwd", p);
            user.set("role", r);
            user.set("roleName", rn);
            await user.save();
        } else {
            if (staffUsers.find(x => x.account === a)) return alert('账号已存在');
            const user = Bmob.Object(TABLE_USER);
            user.set("account", a);
            user.set("pwd", p);
            user.set("role", r);
            user.set("roleName", rn);
            await user.save();
        }
        await loadAllData();
        closeUserEditModal();
        alert('保存成功');
    } catch (e) { alert('失败：'+e.message); }
}

async function delUser(account) {
    if (!confirm('确定删除该员工？')) return;
    try {
        let userItem = staffUsers.find(x => x.account === account);
        const user = Bmob.Object(TABLE_USER);
        user.id = userItem.objectId;
        await user.destroy();
        await loadAllData();
    } catch (e) { alert('失败：'+e.message); }
}

function closeUserEditModal() {
    document.getElementById('userEditModal').style.display = 'none';
}

function loadJigongList() {
    let sel = document.getElementById('jigongSelect');
    sel.innerHTML = '<option value="">请选择机工</option>';
    staffUsers.filter(u => u.role === 'jigong').forEach(u => {
        let o = document.createElement('option');
        o.value = u.account;
        o.innerText = u.account;
        sel.appendChild(o);
    });
}

function renderTable() {
    let tb = document.getElementById('orderTable');
    let kw = document.getElementById('searchInput').value.toLowerCase();
    let list = orders;
    if (currentUser && currentUser.isCustomer) {
        list = orders.filter(o => (o.dianhua || '') === currentUser.phone);
    } else {
        list = orders.filter(o => {
            let n = (o.xingming || '').toLowerCase();
            let p = (o.dianhua || '').toLowerCase();
            let no = (o.orderNo || '').toLowerCase();
            let g = (o.huohao || '').toLowerCase();
            return n.includes(kw) || p.includes(kw) || no.includes(kw) || g.includes(kw);
        });
    }
    tb.innerHTML = '';
    list.forEach(o => {
        let op = '';
        if (currentUser && !currentUser.isCustomer) {
            if (currentUser.role === 'admin') {
                op = `<span class="opt-btn edit-btn" onclick="editOrder('${o.objectId}')">编辑</span><span class="opt-btn del-btn" onclick="delOrder('${o.objectId}')">删除</span>`;
            } else if (['chong','jigong'].includes(currentUser.role)) {
                op = `<span class="opt-btn edit-btn" onclick="editOrder('${o.objectId}')">编辑</span>`;
            }
        }
        let tr = document.createElement('tr');
        tr.innerHTML = `
        <td><span class="order-no" onclick="showDetail('${o.objectId}')">${o.orderNo}</span></td>
        <td>${o.chongrong || '未充绒'}</td>
        <td>${o.jigong || ''}</td>
        <td>${o.xingming || ''}</td>
        <td>${o.dianhua || ''}</td>
        <td><span class="tag ${o.shifou2==='是'?'tag-success':'tag-danger'}">${o.shifou2||'否'}</span></td>
        <td><span class="tag ${o.shifou1==='是'?'tag-success':'tag-danger'}">${o.shifou1||'否'}</span></td>
        <td>${o.riqi || ''}</td>
        <td>${op}</td>`;
        tb.appendChild(tr);
    });
}

function openEditModal(id) {
    editId = id;
    loadJigongList();
    let m = document.getElementById('editModal');
    document.getElementById('editModalTitle').innerText = id ? '编辑订单' : '新增订单';
    if (id) {
        let o = orders.find(x => x.objectId === id);
        document.getElementById('chongrong').value = o.chongrong || '未充绒';
        document.getElementById('jigongSelect').value = o.jigong || '';
        document.getElementById('shifou1').value = o.shifou1 || '否';
        document.getElementById('xingming').value = o.xingming || '';
        document.getElementById('dianhua').value = o.dianhua || '';
        document.getElementById('changjia').value = o.changjia || '';
        document.getElementById('huohao').value = o.huohao || '';
        document.getElementById('yanse').value = o.yanse || '';
        document.getElementById('daxiao').value = o.daxiao || '';
        document.getElementById('jiage').value = o.jiage || '';
        document.getElementById('yajin').value = o.yajin || '';
        document.getElementById('shifou2').value = o.shifou2 || '否';
        document.getElementById('riqi').value = o.riqi || '';
        document.getElementById('beizhu').value = o.beizhu || '';
        document.getElementById('qianshou').value = o.qianshou || '否';
        let all = m.querySelectorAll('input,select');
        all.forEach(e => e.disabled = true);
        if (currentUser.role === 'chong') document.getElementById('chongrong').disabled = false;
        else if (currentUser.role === 'jigong') {
            document.getElementById('jigongSelect').disabled = false;
            document.getElementById('shifou1').disabled = false;
        } else if (currentUser.role === 'admin') all.forEach(e => e.disabled = false);
    } else {
        m.querySelectorAll('input,select').forEach(e => e.value = '');
        document.getElementById('chongrong').value = '未充绒';
        m.querySelectorAll('input,select').forEach(e => e.disabled = false);
    }
    m.style.display = 'flex';
}

async function saveOrder() {
    let d = {
        chongrong: document.getElementById('chongrong').value,
        jigong: document.getElementById('jigongSelect').value,
        shifou1: document.getElementById('shifou1').value,
        xingming: document.getElementById('xingming').value,
        dianhua: document.getElementById('dianhua').value,
        changjia: document.getElementById('changjia').value,
        huohao: document.getElementById('huohao').value,
        yanse: document.getElementById('yanse').value,
        daxiao: document.getElementById('daxiao').value,
        jiage: document.getElementById('jiage').value,
        yajin: document.getElementById('yajin').value,
        shifou2: document.getElementById('shifou2').value,
        riqi: document.getElementById('riqi').value,
        beizhu: document.getElementById('beizhu').value,
        qianshou: document.getElementById('qianshou').value
    };
    try {
        if (editId) {
            const order = Bmob.Object(TABLE_ORDER);
            order.id = editId;
            for(let k in d) order.set(k, d[k]);
            await order.save();
        } else {
            let maxNo = START_ORDER_NO;
            orders.forEach(o => {
                let no = parseInt(o.orderNo);
                if(no>maxNo) maxNo = no;
            });
            const order = Bmob.Object(TABLE_ORDER);
            for(let k in d) order.set(k, d[k]);
            order.set('orderNo', String(maxNo+1));
            await order.save();
        }
        await loadAllData();
        closeEditModal();
    } catch (e) { alert('失败：'+e.message); }
}

function editOrder(id) { openEditModal(id); }
async function delOrder(id) {
    if (!confirm('确定删除该订单？')) return;
    try {
        const order = Bmob.Object(TABLE_ORDER);
        order.id = id;
        await order.destroy();
        await loadAllData();
    } catch (e) { alert('失败：'+e.message); }
}
function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }
function showDetail(id) {
    let o = orders.find(x => x.objectId === id);
    let box = document.getElementById('detailBox');
    box.innerHTML = `
    <div style="padding:10px 0;border-bottom:1px solid #f0f0f0;">订单编号：${o.orderNo}</div>
    <div style="padding:10px 0;border-bottom:1px solid #f0f0f0;">充绒状态：${o.chongrong||'未充绒'}</div>
    <div style="padding:10px 0;border-bottom:1px solid #f0f0f0;">机工：${o.jigong||''}</div>
    <div style="padding:10px 0;border-bottom:1px solid #f0f0f0;">是否完工：${o.shifou1||'否'}</div>
    <div style="padding:10px 0;border-bottom:1px solid #f0f0f0;">客户姓名：${o.xingming||''}</div>
    <div style="padding:10px 0;border-bottom:1px solid #f0f0f0;">联系电话：${o.dianhua||''}</div>
    <div style="padding:10px 0;border-bottom:1px solid #f0f0f0;">厂家：${o.changjia||''}</div>
    <div style="padding:10px 0;border-bottom:1px solid #f0f0f0;">货号：${o.huohao||''}</div>
    <div style="padding:10px 0;border-bottom:1px solid #f0f0f0;">颜色：${o.yanse||''}</div>
    <div style="padding:10px 0;border-bottom:1px solid #f0f0f0;">尺码：${o.daxiao||''}</div>
    <div style="padding:10px 0;border-bottom:1px solid #f0f0f0;">单价：${o.jiage||''}</div>
    <div style="padding:10px 0;border-bottom:1px solid #f0f0f0;">押金：${o.yajin||''}</div>
    <div style="padding:10px 0;border-bottom:1px solid #f0f0f0;">是否到货：${o.shifou2||'否'}</div>
    <div style="padding:10px 0;border-bottom:1px solid #f0f0f0;">订单日期：${o.riqi||''}</div>
    <div style="padding:10px 0;border-bottom:1px solid #f0f0f0;">备注：${o.beizhu||''}</div>
    <div style="padding:10px 0;">签收：${o.qianshou||'否'}</div>`;
    document.getElementById('detailModal').style.display = 'flex';
}
function closeDetailModal() { document.getElementById('detailModal').style.display = 'none'; }
function exportExcel() {
    let data = [["订单编号","充绒状态","机工","是否完工","客户姓名","电话","厂家","货号","颜色","尺码","单价","押金","是否到货","订单日期","备注","签收"]];
    orders.forEach(o => {
        data.push([
            o.orderNo, o.chongrong||'未充绒', o.jigong||'', o.shifou1||'',
            o.xingming||'', o.dianhua||'', o.changjia||'', o.huohao||'',
            o.yanse||'', o.daxiao||'', o.jiage||'', o.yajin||'',
            o.shifou2||'', o.riqi||'', o.beizhu||'', o.qianshou||''
        ]);
    });
    let ws = XLSX.utils.aoa_to_sheet(data);
    let wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "订单列表");
    XLSX.writeFile(wb, "羽绒服订单.xlsx");
}
